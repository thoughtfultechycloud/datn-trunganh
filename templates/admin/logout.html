{% load i18n static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% trans "Đã đăng xuất" %} | AIBox</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --amber:      #ffc107;
      --amber-dark: #e6a800;
      --amber-dim:  rgba(255,193,7,0.12);
      --dark:       #1c1a14;
      --dark-2:     #2a2618;
      --text:       #1c1a14;
      --muted:      #7a7560;
      --border:     #e8e4d4;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f4f6f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10), 0 0 0 1px rgba(255,193,7,0.12);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      text-align: center;
    }

    .card-header {
      background: var(--dark-2);
      border-bottom: 2px solid var(--amber);
      padding: 32px 40px 24px;
      position: relative;
    }

    .card-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(255,193,7,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .card-header .logo {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      overflow: hidden;
      background: var(--amber);
      margin: 0 auto 14px;
      box-shadow: 0 8px 24px rgba(255,193,7,0.4);
    }

    .card-header .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    .card-header p {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
    }

    .card-body {
      padding: 32px 40px 36px;
    }

    .icon-check {
      width: 60px;
      height: 60px;
      background: var(--amber-dim);
      border: 2px solid var(--amber);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 26px;
    }

    .card-body h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .card-body p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .btn-login {
      display: inline-block;
      width: 100%;
      padding: 12px;
      background: var(--amber);
      color: var(--dark);
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(255,193,7,0.4);
      font-family: inherit;
    }
    .btn-login:hover {
      background: var(--amber-dark);
      box-shadow: 0 6px 20px rgba(255,193,7,0.5);
      color: var(--dark);
      text-decoration: none;
    }

    .footer-note {
      margin-top: 20px;
      font-size: 12px;
      color: #bbb;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="logo"><img src="{% static 'images/logo.svg' %}" alt="AIBox Logo"></div>
    <h1>AI Box</h1>
    <p>Quản lí chi phí dự án cty AI Box</p>
  </div>

  <div class="card-body">
    <div class="icon-check">👋</div>
    <h2>{% trans "You have been signed out" %}</h2>
    <p>{% trans "Thanks for using AIBox. See you next time!" %}</p>
    <a href="{% url 'admin:index' %}" class="btn-login">{% trans "Sign in again" %}</a>
    <p class="footer-note">© AIBox Company</p>
  </div>
</div>

</body>
</html>
