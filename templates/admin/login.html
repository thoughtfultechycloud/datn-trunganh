{% load i18n static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% trans "Sign In" %} | {{ site_header|default:_('Administration') }}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --amber:      #ffc107;
      --amber-dark: #e6a800;
      --amber-dim:  rgba(255,193,7,0.12);
      --dark:       #1c1a14;
      --dark-2:     #2a2618;
      --dark-3:     #3a3520;
      --text:       #1c1a14;
      --muted:      #7a7560;
      --border:     #e8e4d4;
      --bg:         #fffdf4;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      background: var(--dark-2);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(255,193,7,0.18) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 20%, rgba(255,193,7,0.10) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 90%, rgba(255,193,7,0.08) 0%, transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,193,7,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,193,7,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
    }

    .card {
      background: var(--bg);
      border-radius: 20px;
      box-shadow: 0 30px 70px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,193,7,0.15);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }

    .card-header {
      background: var(--dark-2);
      border-bottom: 2px solid var(--amber);
      padding: 36px 40px 28px;
      text-align: center;
      color: #fff;
      position: relative;
    }

    .card-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(255,193,7,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .card-header .logo {
      width: 160px;
      height: 60px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      overflow: hidden;
      background: transparent;
    }

    .card-header .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .card-header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #fff;
    }
    .card-header p {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-top: 4px;
    }

    .card-body { padding: 32px 40px 28px; }

    .messages { margin-bottom: 16px; }
    .messages li {
      list-style: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .messages .error {
      background: #fff5f5;
      color: #c0392b;
      border: 1px solid #fcc;
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 7px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text);
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      font-family: inherit;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px var(--amber-dim);
    }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 12px;
      color: var(--amber-dark);
      text-decoration: none;
      margin-top: 7px;
      font-weight: 500;
    }
    .forgot-link:hover { text-decoration: underline; }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: var(--amber);
      color: var(--dark);
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
      margin-top: 8px;
      font-family: inherit;
      letter-spacing: 0.2px;
      box-shadow: 0 4px 14px rgba(255,193,7,0.4);
    }
    .btn-login:hover {
      background: var(--amber-dark);
      box-shadow: 0 6px 20px rgba(255,193,7,0.5);
    }
    .btn-login:active { transform: scale(0.98); }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: var(--muted);
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .btn-google {
      width: 100%;
      padding: 11px;
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    .btn-google:hover {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px var(--amber-dim);
    }

    .btn-google svg { width: 18px; height: 18px; flex-shrink: 0; }

    .card-footer {
      text-align: center;
      padding: 0 40px 28px;
      font-size: 13px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }
    .card-footer a {
      color: var(--amber-dark);
      text-decoration: none;
      font-weight: 600;
    }
    .card-footer a:hover { text-decoration: underline; }

    input[name="next"] { display: none; }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="logo"><img src="{% static 'images/logo.svg' %}" alt="Logo"></div>
    <h1>{% trans "Welcome back" %}</h1>
    <p>{% trans "Sign in to your account" %}</p>
  </div>

  <div class="card-body">

    {% if form.errors %}
    <ul class="messages">
      <li class="error">{% trans "Invalid username or password. Please try again." %}</li>
    </ul>
    {% endif %}

    <form method="post" action="{{ app_path }}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div class="form-group">
        <label for="id_username">{% trans "Username or Email" %}</label>
        <input type="text" id="id_username" name="username"
               value="{{ form.username.value|default:'' }}"
               placeholder="you@example.com" autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label for="id_password">{% trans "Password" %}</label>
        <input type="password" id="id_password" name="password"
               placeholder="••••••••" autocomplete="current-password">
      </div>

      <button type="submit" class="btn-login">{% trans "Sign In" %}</button>
    </form>

  </div>
</div>

</body>
</html>
